name: Deploy C_Data to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */2 * * *" # Tự động quét và cập nhật lại toàn bộ việc làm mỗi 2 giờ
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install & Verify Backend
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main; print('Backend Verified!')"

      - name: Run Deep Quality Harvester on Cloud
        continue-on-error: true
        env:
          PYTHONPATH: "./backend"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/run_deep_quality_harvester.py --once || true
          python scripts/apply_verified_evidence.py || true

      - name: Run Rigorous Realtime Search & Data Quality Tests
        env:
          PYTHONPATH: "./backend"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -u tests/test_realtime_search_and_data.py > test_results.log 2>&1 || (cat test_results.log; cat test_results.log >> $GITHUB_STEP_SUMMARY; exit 1)
          cat test_results.log
          cat test_results.log >> $GITHUB_STEP_SUMMARY

      - name: Commit & Sync Updated Jobs Dataset (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/jobs.json backend/cdata.db || true
          if [ -n "$(git status --porcelain frontend/public/data/jobs.json)" ]; then
            git commit -m "chore(auto-harvest): sync verified quality jobs [skip ci]" || true
            git push origin main || echo "Push skipped or not needed"
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Static Export for GitHub Pages
        working-directory: ./frontend
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Create .nojekyll
        run: touch frontend/out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
