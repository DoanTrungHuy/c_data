name: Deploy C_Data to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *" # Tự động quét và cập nhật lại toàn bộ việc làm mỗi 6 giờ
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install & Verify Backend
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          python -c "import app.main; print('Backend Verified!')"

      - name: Run Background Harvester & Zero-404 Audit
        working-directory: ./backend
        run: |
          python scripts/run_background_harvester_daemon.py --once

      - name: Run Rigorous Realtime Search & Data Quality Tests
        run: |
          python tests/test_realtime_search_and_data.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Static Export for GitHub Pages
        working-directory: ./frontend
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Create .nojekyll
        run: touch frontend/out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
