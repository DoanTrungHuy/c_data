<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background / Ring Gradient -->
    <linearGradient id="cdata-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Star / Beacon Gradient -->
    <linearGradient id="beacon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle tech mesh -->
  <rect width="64" height="64" rx="18" fill="#0F172A" />

  <!-- Outer Ambient Radial Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#cdata-gradient)" opacity="0.15" />

  <!-- Stylized Geometric "C" Arc (Radar Ring) -->
  <path
    d="M48 20 C43 13 35 11 28 13 C19 16 13 24 13 32 C13 40 19 48 28 51 C36 53 43 50 48 44"
    stroke="url(#cdata-gradient)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Radar Scanning Waves -->
  <path
    d="M44 26 C41 22 36 21 32 22 C26 24 22 29 22 34 C22 38 25 42 30 43 C33 44 37 43 40 40"
    stroke="#38BDF8"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Central Opportunity Beacon (4-pointed Compass Star) -->
  <g transform="translate(32, 32)">
    <!-- Pulse ring -->
    <circle r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.8" />
    
    <!-- Radiant Star -->
    <path
      d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z"
      fill="url(#beacon-gradient)"
    />
    <!-- Center Bright Dot -->
    <circle r="2" fill="#FFFFFF" />
  </g>

  <!-- Top-right Connected Pulse Node -->
  <circle cx="48" cy="20" r="3" fill="#38BDF8" />
  <circle cx="48" cy="20" r="1.5" fill="#FFFFFF" />
</svg>
