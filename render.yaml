services:
  # 1. Backend FastAPI Web Service
  - type: web
    name: cdata-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true

  # 2. Frontend Next.js Web Service
  - type: web
    name: cdata-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: cdata-backend
          property: host
